# The NOTIXV landings pipeline (k3s repo, 02-environments/landings/astro/README.md step 5),
# plus the CMS image: with the strapi module on, <repo>-cms is built from the same commit
# with the same tag. Identical in every client repo; the template itself builds nothing.
# The site is built on the runner, not in Docker, so Astro's resized images can be cached.
name: Build & publish

on:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: notixv
  REGION: europe-west3
  AR_REPO: landings

jobs:
  build:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    # A cold image cache re-encodes every image; that takes minutes, not tens of them.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Derive image tag
        run: |
          IMAGE=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short HEAD)
          TS=$(date +%s)
          case "$GITHUB_REF" in
            refs/heads/dev)  TAG="dev-${SHA}-${TS}" ;;
            refs/heads/main) TAG="rel-${SHA}-${TS}" ;;
            *) echo "unexpected ref $GITHUB_REF" >&2; exit 1 ;;
          esac
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}"
          echo "IMAGE_URL=${BASE}/${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "CMS_IMAGE_URL=${BASE}/${IMAGE}-cms:${TAG}" >> "$GITHUB_OUTPUT"
          echo "SITE_URL=https://${IMAGE}.landings.notixv.com" >> "$GITHUB_OUTPUT"
          # The CMS image only when modules.config.ts switches strapi on.
          if grep -Eq '^\s*strapi:\s*true' modules.config.ts; then echo "CMS=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --fund=false
      - run: npm run images:check

      # Astro's image cache: only images (or widths) the last saved build didn't have are encoded.
      - id: images-restore
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-
          restore-keys: astro-images-
      - run: npm run build
        env:
          SITE_URL: ${{ steps.tag.outputs.SITE_URL }}
      - id: images
        name: Prune the image cache
        run: |
          node scripts/images.mjs prune-cache
          mkdir -p node_modules/.astro/assets
          echo "key=astro-images-$(ls node_modules/.astro/assets | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Saved only when the set of images changed.
      - if: steps.images.outputs.key != steps.images-restore.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: node_modules/.astro/assets
          key: ${{ steps.images.outputs.key }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/559585018204/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-actions@notixv.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.IMAGE_URL }}
          # The build above, instead of building again inside Docker.
          build-args: |
            ASTRO_BUILD=prebuilt
          build-contexts: |
            dist=./dist
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
          provenance: false

      # What Strapi fills its empty site-page fields with on every start: the copy and each
      # empty image's default, worked out by the site's own code (installed above).
      - name: Strapi seed
        if: steps.tag.outputs.CMS == 'true'
        run: npm run strapi:seed
      - if: steps.tag.outputs.CMS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: src/modules/strapi/strapi
          push: true
          tags: ${{ steps.tag.outputs.CMS_IMAGE_URL }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms
          provenance: false
